<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Танец Смерти — таймлайн</title>
<meta name="description" content="Хронология событий «Танца Смерти»">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b1f29;
    --ink-soft: #5e4a58;
    --paper: rgba(253, 238, 233, 0.74);   /* светлый персик неба */
    --pill: rgba(250, 228, 220, 0.86);
    --paper-edge: rgba(255, 255, 255, 0.55);
    --spine: rgba(52, 34, 48, 0.45);
    --t0: #b4532e;   /* основная линия — оранжевый отблеск на стеблях */
    --t1: #4b62a6;   /* вторая линия — голубой отблеск */
    --t2: #6d6a3a;
    --t3: #7a4a63;
    --hand: "Caveat", "Bad Script", cursive;
    --title: "Marck Script", "Caveat", cursive;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #b2979a;
    color: var(--ink);
    font-family: var(--hand);
    font-size: 23px;
    line-height: 1.25;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- фон: поле борщевика, параллакс сверху вниз ---------- */
  .bg {
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    background: #b2979a;
  }
  .bg img {
    position: absolute; left: 50%; top: 0;
    max-width: none;
    transform: translateX(-50%);
    will-change: transform;
    user-select: none;
  }
  .grain {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.07; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.22  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- шапка ---------- */
  header {
    overflow-x: clip;
    text-align: center;
    padding: 12vh 16px 5vh;
  }
  h1 {
    font-family: var(--title);
    font-weight: 400;
    font-size: clamp(56px, 11vw, 128px);
    line-height: 1;
    margin: 0;
    color: #241a22;
    /* хроматический сдвиг, как на стеблях борщевика: оранжевый край слева, голубой справа */
    --ca: 0.032em;
    text-shadow:
      calc(var(--ca) * -1) 0 0 rgba(232, 92, 38, 0.85),
      var(--ca) 0 0 rgba(64, 120, 235, 0.8),
      0 0 0.25em rgba(255, 214, 196, 0.9),
      0 0 0.7em rgba(250, 196, 176, 0.7),
      0 0 1.4em rgba(246, 186, 168, 0.5);
    position: relative; isolation: isolate;
  }
  h1::before { /* широкое персиковое свечение, как просвет в облаках */
    content: ""; position: absolute; z-index: -1;
    left: 50%; top: 95%; width: min(1200px, 100vw); height: 4.2em;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 210, 188, 0.95), rgba(250, 194, 174, 0.6) 50%, rgba(246, 190, 172, 0));
    filter: blur(10px);
    pointer-events: none;
  }
  .sub {
    margin-top: 10px;
    font-size: 28px;
    color: var(--ink-soft);
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 10px 26px; justify-content: center;
    margin-top: 26px; font-size: 24px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i {
    width: 22px; height: 4px; border-radius: 3px; display: inline-block;
    transform: rotate(-4deg);
  }
  .status {
    margin-top: 14px; font-size: 21px; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .status a { color: inherit; text-underline-offset: 3px; }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #8a9a6a;
    box-shadow: 0 0 0 0 rgba(138,154,106,0.6);
  }
  .status.live .dot { animation: pulse 2.4s ease-out infinite; }
  .status.err .dot { background: #a5563f; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(138,154,106,0.55); } 100% { box-shadow: 0 0 0 10px rgba(138,154,106,0); } }

  /* ---------- таймлайн ---------- */
  .timeline {
    position: relative;
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 16px 18vh;
  }
  /* Хребет рисуется отдельно для каждой главы, поэтому на «N лет спустя» пунктир рвётся */
  .chapter { position: relative; padding: 10px 0 30px; }
  .chapter::before { /* хребет — неровная карандашная линия */
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; margin-left: -1px;
    background: repeating-linear-gradient(to bottom, var(--spine) 0 14px, transparent 14px 20px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60px, #000 calc(100% - 60px), transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 60px, #000 calc(100% - 60px), transparent);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    align-items: start;
    margin: 18px 0;
  }
  .row .knot {
    grid-column: 2; justify-self: center; margin-top: 22px;
    width: 12px; height: 12px; border-radius: 50%;
    /* плоская тёмная точка с красной и синей кромкой — как стебли на фоне и заголовок */
    background: #241a22;
    box-shadow: -2px 0 0 #ef4a22, 2px 0 0 #3b6cf0, 0 0 10px 2px rgba(255, 236, 228, 0.55);
    position: relative; z-index: 1;
  }
  .row .slot { min-width: 0; }
  .row .slot.l { grid-column: 1; display: flex; justify-content: flex-end; }
  .row .slot.r { grid-column: 3; }

  .year {
    position: relative; z-index: 1;
    text-align: center;
    margin: 56px 0 26px;
  }
  .year span {
    display: inline-block;
    font-family: var(--title);
    font-size: 54px; line-height: 1;
    padding: 6px 22px 10px;
    background: var(--pill);
    border-radius: 40% 55% 45% 50% / 60% 45% 55% 40%;
    box-shadow: 0 6px 24px rgba(60,30,50,0.12);
  }
  .gap {
    text-align: center; position: relative; z-index: 1;
    margin: 30px 0;
    font-size: 30px; color: var(--ink-soft);
  }
  .gap span {
    display: inline-block; padding: 4px 18px;
    background: var(--pill); border-radius: 30px; box-shadow: 0 6px 24px rgba(60,30,50,0.12);
  }

  .card {
    position: relative;
    max-width: 500px; width: 100%;
    padding: 16px 22px 18px;
    background: var(--paper);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid var(--paper-edge);
    border-radius: 6px 10px 7px 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px rgba(60,30,50,0.14);
    transform: rotate(var(--rot, 0deg));
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .card:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 16px 40px rgba(60,30,50,0.2); }
  .card::before { /* полоска цвета линии, как маркер */
    content: ""; position: absolute; top: 14px; bottom: 14px; width: 4px; border-radius: 3px;
    background: var(--tc); opacity: 0.75;
  }
  .slot.l .card::before { right: -2px; }
  .slot.r .card::before { left: -2px; }
  .card .date {
    font-weight: 700; font-size: 27px; color: var(--tc);
    margin-bottom: 6px;
  }
  .card .tag { display: none; }
  .card p { margin: 0 0 10px; white-space: pre-line; }
  .card p:last-child { margin-bottom: 0; }
  .card hr {
    border: 0; height: 10px; margin: 12px 0;
    background: radial-gradient(circle, var(--ink-soft) 1.2px, transparent 1.6px) center / 16px 10px repeat-x;
    opacity: 0.5;
  }

  /* появление при прокрутке */
  /* тень и размытие под карточкой проявляются вместе с ней, а не «щёлкают» в конце */
  .reveal {
    opacity: 0; transform: translateY(18px) rotate(var(--rot, 0deg));
    box-shadow: 0 1px 0 rgba(255,255,255,0) inset, 0 0 0 rgba(60,30,50,0);
    -webkit-backdrop-filter: blur(0px) saturate(1); backdrop-filter: blur(0px) saturate(1);
    transition: opacity .7s ease, transform .7s ease, box-shadow 1s ease .15s, backdrop-filter 1s ease .1s, -webkit-backdrop-filter 1s ease .1s;
  }
  .reveal.in {
    opacity: 1; transform: rotate(var(--rot, 0deg));
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px rgba(60,30,50,0.14);
    -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
  }
  .reveal.in:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 16px 40px rgba(60,30,50,0.2); }

  .loading { text-align: center; font-size: 30px; color: var(--ink-soft); padding: 10vh 0; position: relative; z-index: 1; }
  .loading span { background: var(--pill); padding: 6px 20px; border-radius: 30px; }

  /* текст прямо на небе: вместо плашек — персиковый ореол, как у заголовка */
  .glow {
    position: relative; z-index: 1;
    color: var(--ink);
    font-weight: 600;
    text-shadow:
      0 0 14px rgba(255, 222, 206, 0.9),
      0 0 30px rgba(250, 202, 182, 0.6);
  }
  header .sub {
    margin-top: 6px;
    font-size: 32px;
  }
  header .sub a, .sign a { color: var(--t0); text-decoration: none; }
  header .sub a:hover, .sign a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* подвал — как подпись художника в углу картины, на светлом горизонте */
  footer {
    max-width: 1180px; margin: 0 auto;
    padding: 0 16px max(130px, 13vh);
    display: flex; justify-content: center;
  }
  .sign { position: relative; isolation: isolate; text-align: center; transform: rotate(-2deg); }
  .sign::before {
    content: ""; position: absolute; z-index: -1; inset: -40px -90px;
    background: radial-gradient(closest-side, rgba(255, 254, 252, 0.97), rgba(255, 250, 247, 0.75) 55%, rgba(255, 250, 247, 0));
    filter: blur(8px); pointer-events: none;
  }
  .sign.glow { /* внизу ореол белый, как зарево у горизонта */
    /* первые два слоя — тонкая белая обводка, чтобы мелкие буквы не тонули в траве */
    text-shadow:
      0 0 1px #fff, 0 0 1px #fff, 0 0 2px rgba(255, 255, 255, 0.9),
      0 0 10px rgba(255, 253, 251, 1), 0 0 24px rgba(255, 250, 246, 0.85);
  }
  .sign .line { font-size: 25px; font-weight: 700; }
  .sign .name {
    display: inline-block;
    font-family: var(--title); font-size: 64px; line-height: 1;
    margin: 2px 0 4px;
  }
  .sign .name a { color: var(--ink); text-shadow: none; }
  .sign svg { display: block; margin: -10px auto 6px; width: 190px; height: 18px; }
  .sign .src { font-size: 21px; font-weight: 700; }
  .sign .src a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  /* ---------- узкий экран: одна колонка ---------- */
  @media (max-width: 760px) {
    .sign .name { font-size: 52px; }
    header .sub { font-size: 30px; }
    body { font-size: 21px; }
    header { padding-top: 8vh; }
    .timeline { padding-left: 16px; padding-right: 16px; }
    .chapter::before { left: 12px; }
    .row { grid-template-columns: 26px 1fr; margin: 14px 0; }
    .row .knot { grid-column: 1; grid-row: 1 / span 3; margin-top: 20px; width: 12px; height: 12px; }
    .row .slot.l, .row .slot.r { grid-column: 2; justify-content: flex-start; }
    .row .slot.r { margin-top: 12px; }
    .row .slot.l:empty, .row .slot.r:empty { display: none; }
    .row .slot.l .card::before { right: auto; left: -2px; }
    .card { max-width: none; padding: 14px 18px 16px; }
    .card .tag { display: block; font-size: 18px; color: var(--tc); opacity: .85; margin: -4px 0 4px; }
    .year { text-align: left; margin: 40px 0 18px; }
    .year span { font-size: 44px; }
    .gap { text-align: left; padding-left: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1; transform: rotate(var(--rot, 0deg)); transition: none;
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px rgba(60,30,50,0.14);
      -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1); }
    .status.live .dot { animation: none; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><img id="bg-img" src="bg.webp" alt=""></div>
<div class="grain" aria-hidden="true"></div>

<header>
  <h1 id="title">Танец Смерти</h1>
  <div class="sub glow">таймлайн событий · автор — <a href="https://vk.ru/shuchila" target="_blank" rel="noopener">Шучила</a></div>
  <div class="legend glow" id="legend"></div>
  <div><div class="status glow" id="status"><span class="dot"></span><span id="status-text">загружаю таблицу…</span> · <a id="sheet-link-top" target="_blank" rel="noopener">таблица</a></div></div>
</header>

<main class="timeline" id="timeline">
  <div class="loading"><span>листаю записи…</span></div>
</main>

<footer>
  <div class="sign glow">
    <div class="line">автор комикса</div>
    <div class="name"><a href="https://vk.ru/shuchila" target="_blank" rel="noopener">Шучила</a></div>
    <svg viewBox="0 0 190 18" aria-hidden="true"><path d="M4 12 C40 4, 80 16, 118 8 S170 6, 186 10" fill="none" stroke="var(--t0)" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/></svg>
    <div class="src">события взяты из <a id="sheet-link" target="_blank" rel="noopener">оригинальной таблице</a></div>
  </div>
</footer>

<script>
  // ---------- настройки ----------
  const SHEET_ID = "1_UhgVWsQqOCOUiJELDhf6V_ox3jjNh19w1ucFmHJD4I";
  const GID = "0";
  const POLL_MS = 60 * 1000;
  // Названия сюжетных линий — по порядку пар «дата/событие» в таблице сверху вниз.
  const TRACK_NAMES = ["основная линия", "Серёжа и Саня"];
  const TRACK_COLORS = ["var(--t0)", "var(--t1)", "var(--t2)", "var(--t3)"];

  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&gid=${GID}`;
  const CACHE_KEY = "dod-timeline-csv";
  for (const id of ["sheet-link", "sheet-link-top"])
    document.getElementById(id).href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${GID}`;

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Таблица «лежит на боку»: строки — поля (дата / событие), столбцы — моменты времени.
  // Каждая пара строк «дата» + «событие» — отдельная сюжетная линия.
  function toTimeline(rows) {
    const norm = s => (s || "").trim().toLowerCase();
    const tracks = [];
    for (let i = 0; i < rows.length - 1; i++) {
      if (norm(rows[i][0]) === "дата" && norm(rows[i + 1][0]) === "событие") { tracks.push([rows[i], rows[i + 1]]); i++; }
    }
    const width = Math.max(0, ...rows.map(r => r.length));
    const moments = [];
    let year = null;
    for (let c = 1; c < width; c++) {
      const entries = tracks.map(([d, e], t) => ({ track: t, date: (d[c] || "").trim(), text: (e[c] || "").trim() }))
                            .filter(x => x.date || x.text);
      if (!entries.length) continue;
      const years = entries.map(x => (x.date.match(/(19|20)\d{2}/g) || []).map(Number)).flat();
      const y = years.length ? Math.min(...years) : year;
      moments.push({ year: y, entries });
      if (years.length) year = Math.max(...years);
    }
    return { trackCount: tracks.length, moments };
  }

  // ---------- рендер ----------
  const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function textToHTML(text) {
    return text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
      .map(p => /^_{3,}$/.test(p) ? "<hr>" : `<p>${esc(p)}</p>`).join("");
  }
  const rot = i => (((i * 37) % 11) - 5) * 0.14; // стабильный «небрежный» наклон

  function cardHTML(entry, i) {
    const color = TRACK_COLORS[entry.track % TRACK_COLORS.length];
    const name = TRACK_NAMES[entry.track] || `линия ${entry.track + 1}`;
    return `<article class="card reveal" style="--tc:${color};--rot:${rot(i)}deg">
      ${entry.date ? `<div class="date">${esc(entry.date)}</div>` : ""}
      <div class="tag">${esc(name)}</div>
      ${textToHTML(entry.text)}
    </article>`;
  }

  function render(data, animate) {
    const legend = document.getElementById("legend");
    legend.innerHTML = Array.from({ length: data.trackCount }, (_, t) =>
      `<span><i style="background:${TRACK_COLORS[t % TRACK_COLORS.length]}"></i>${esc(TRACK_NAMES[t] || `линия ${t + 1}`)}</span>`).join("");

    let html = `<div class="chapter">`, prevYear = null, n = 0;
    for (const m of data.moments) {
      if (m.year != null && m.year !== prevYear) {
        if (prevYear != null && m.year - prevYear >= 3) {
          const d = m.year - prevYear;
          html += `</div><div class="gap"><span>${d} ${plural(d, "год", "года", "лет")} спустя</span></div><div class="chapter">`;
        }
        html += `<div class="year"><span>${m.year}</span></div>`;
        prevYear = m.year;
      }
      // на широком экране: первая линия слева, остальные справа
      const left = m.entries.filter(e => e.track === 0), right = m.entries.filter(e => e.track !== 0);
      html += `<section class="row">
        <div class="slot l">${left.map(e => cardHTML(e, n++)).join("")}</div>
        <div class="knot"></div>
        <div class="slot r">${right.map(e => cardHTML(e, n++)).join("")}</div>
      </section>`;
    }
    html += `</div>`;
    const tl = document.getElementById("timeline");
    tl.innerHTML = data.moments.length ? html : `<div class="loading"><span>в таблице пока пусто</span></div>`;
    const cards = tl.querySelectorAll(".reveal");
    if (!animate || !("IntersectionObserver" in window)) { cards.forEach(c => c.classList.add("in")); return; }
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px" });
    cards.forEach(c => io.observe(c));
  }

  // ---------- загрузка и «живое» обновление ----------
  let lastCSV = null;
  const statusEl = document.getElementById("status"), statusText = document.getElementById("status-text");
  const hhmm = () => new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  function apply(csv, animate) {
    if (csv === lastCSV) return false;
    lastCSV = csv;
    render(toTimeline(parseCSV(csv)), animate);
    return true;
  }

  async function refresh(first) {
    try {
      const res = await fetch(`${CSV_URL}&_=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const csv = await res.text();
      const changed = apply(csv, first && lastCSV === null);
      try { localStorage.setItem(CACHE_KEY, csv); } catch (_) {}
      statusEl.className = "status glow live";
      statusText.textContent = changed && !first ? `есть изменения · ${hhmm()}` : `синхронизировано · ${hhmm()}`;
    } catch (err) {
      statusEl.className = "status glow err";
      statusText.textContent = lastCSV ? "нет связи с таблицей, показываю сохранённое" : "не удалось загрузить таблицу";
    }
  }

  // ---------- параллакс фона ----------
  // Картинка масштабируется «по cover» без растяжения; по мере прокрутки страницы
  // она плавно едет от своего верха (в начале) к низу (в конце).
  const bgImg = document.getElementById("bg-img");
  let bgTravel = 0, bgTicking = false;
  function layoutBg() {
    if (!bgImg.naturalWidth) return;
    const vw = innerWidth, vh = innerHeight;
    // минимум 1.3 высоты экрана, чтобы и на узком телефоне было куда ехать
    const k = Math.max(vw / bgImg.naturalWidth, vh * 1.3 / bgImg.naturalHeight);
    const w = Math.ceil(bgImg.naturalWidth * k), h = Math.ceil(bgImg.naturalHeight * k);
    bgImg.style.width = w + "px"; bgImg.style.height = h + "px";
    bgTravel = Math.max(0, h - vh);
    moveBg();
  }
  function moveBg() {
    bgTicking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
    bgImg.style.transform = `translate3d(-50%, ${-Math.round(p * bgTravel)}px, 0)`;
  }
  addEventListener("scroll", () => { if (!bgTicking) { bgTicking = true; requestAnimationFrame(moveBg); } }, { passive: true });
  // на телефоне адресная строка прячется при прокрутке и меняет высоту окна — из-за этого не перемасштабируем
  let lastW = innerWidth, lastH = innerHeight;
  addEventListener("resize", () => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 150) return moveBg();
    lastW = innerWidth; lastH = innerHeight; layoutBg();
  });
  bgImg.complete ? layoutBg() : bgImg.addEventListener("load", layoutBg);
  new ResizeObserver(moveBg).observe(document.body); // высота страницы меняется после загрузки таблицы

  try { const cached = localStorage.getItem(CACHE_KEY); if (cached) apply(cached, true); } catch (_) {}
  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
</body>
</html>
